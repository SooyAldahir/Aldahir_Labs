<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Aldahir Labs</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark light">
  <script>
    // Tema: el elegido con el botón o, si no hay, el del sistema. Se aplica antes de pintar.
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("al-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Rutas absolutas: la 404 se sirve desde cualquier URL -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <main class="notfound">
    <div>
      <img src="/assets/brand/isotipo.webp" alt="Aldahir Labs" width="391" height="277">
      <span class="mono">// error: route not found</span>
      <h1 class="code-404">4<span>0</span>4</h1>
      <p>Esta ruta todavía no ha sido construida. Volvamos a terreno conocido.</p>
      <a class="btn btn-primary" href="/">Volver al inicio <svg class="icon icon-arrow" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
    </div>
  </main>
</body>
</html>
